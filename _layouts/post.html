<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/intro.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/theme.css' | relative_url }}">
    <style>
        .post-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .post-header {
            margin-bottom: 2rem;
        }
        .post-header h1 {
            margin: 0 0 0.5rem 0;
            color: var(--text-primary);
        }
        .post-meta {
            color: var(--text-tertiary);
            font-size: 0.95rem;
        }
        article {
            color: var(--text-secondary);
            line-height: 1.7;
        }
    </style>
</head>
<body>
    {% include header.html %}
    
    <main class="post-content">
        <article>
            <header class="post-header">
                <h1>{{ page.title }}</h1>
                <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
            </header>
            
            {{ content }}
        </article>
    </main>
    
    <script src="{{ '/assets/theme-toggle.js' | relative_url }}"></script>
</body>
</html>
